[package]
name = "redline-hud"
version = "1.0.0"
description = "REDLINE//HUD hardware telemetry panel for LibreHardwareMonitor"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# polls LibreHardwareMonitor from the Rust side: no CORS / mixed-content rules to trip over
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
