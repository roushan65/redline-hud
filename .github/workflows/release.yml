name: Release executables

# Publishing a GitHub release builds a standalone REDLINE//HUD executable for each OS / CPU.
# Each build job attaches its archive to that release as soon as it passes its smoke test,
# then SHA256SUMS.txt is added for whatever was built.
# "Run workflow" builds the same archives as workflow artifacts; give it the tag of an
# existing release to attach them there too (e.g. to redo one platform that failed).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the builds to (leave empty for artifacts only)
        required: false
        default: ''

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # no package-lock.json in the repo, so resolve from package.json (npm ci needs a lock file)
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.target }})
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # the executable embeds this Node runtime; sea.getAssetKeys() needs 24.8+
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build:standalone

      - name: Smoke test
        shell: bash
        run: |
          exe=$(ls release/redline-hud-${{ matrix.target }}* | grep -vE '\.(zip|tar\.gz)$')
          # PANEL_CONFIG_DIR is relative to the executable's folder, so this lands in release/smoke-config
          PANEL_HOST=127.0.0.1 PANEL_CONFIG_DIR=smoke-config "$exe" > server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat server.log' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:2077/ -o index.html && break; sleep 1; done
          grep -q 'REDLINE//HUD' index.html
          curl -fsS -o /dev/null "http://127.0.0.1:2077$(grep -oE '/assets/[^"]+\.js' index.html | head -1)"
          curl -fsS http://127.0.0.1:2077/api/vendors
          curl -fsS -X PUT -H 'Content-Type: application/json' -d '{"themeId":"netrunner"}' http://127.0.0.1:2077/api/config
          test -f release/smoke-config/config.json
          echo "smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: redline-hud-${{ matrix.target }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.zip release/*.tar.gz)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached ${files[*]} to $RELEASE_TAG"

  checksums:
    # runs even if some platforms failed, so the archives that did attach still get checksums
    # (job-level `if` can't read workflow `env`, hence the repeated tag expression)
    if: always() && (github.event.release.tag_name || inputs.tag) != '' && contains(fromJSON('["success","failure"]'), needs.build.result)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the archives attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$RELEASE_TAG" --dir assets --repo "$GITHUB_REPOSITORY" --pattern 'redline-hud-*' \
            || { echo "::warning::No archives on $RELEASE_TAG, so no checksums written"; exit 0; }
      - name: Checksums
        if: hashFiles('assets/redline-hud-*') != ''
        working-directory: assets
        run: sha256sum redline-hud-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach SHA256SUMS.txt
        if: hashFiles('assets/SHA256SUMS.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" assets/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
